name: Build, Test, Scan and Release

#
# Releases are made by hand from the Actions tab ("Run workflow"), never by pushing a
# tag. That ordering matters: the tag is created by the final "Create GitHub Release"
# step, so it only ever comes into existence for a release that actually passed. A run
# that fails the unit test gate leaves nothing behind to clean up, and the same version
# number can simply be re-run once the fix is pushed.
#
# The version is not typed in here - it is read from InformationalVersion in
# Classic-Repair-Toolbox.csproj, the same property the running app reports (see
# Main/App.axaml.cs). Bumping that property before running this workflow is the only
# place a release version is entered. Pre-release status follows semver: a version
# with a "-" (e.g. "2.5.0-beta.1") is a pre-release, a bare "X.Y.Z" is a full release.
#
on:
  workflow_dispatch:

env:
  PACK_ID: Classic-Repair-Toolbox
  EXE_WINDOWS: Classic-Repair-Toolbox.exe
  EXE_UNIX: Classic-Repair-Toolbox
  PROJECT: src/CRT.App/CRT.App.csproj
  SOLUTION: Classic-Repair-Toolbox.slnx
  TFM_MODERN: net10.0

jobs:
  ###############################################################
  # DETERMINE VERSION
  ###############################################################
  # Reads the release version straight out of the project instead of asking for it by
  # hand - see the comment at the top of this file. Every other job reads it from here
  # rather than re-deriving it, so there is exactly one place this happens.
  #
  # The same goes for vpk, the Velopack tool every build job packs with: its version is the
  # Velopack package's in CRT.App.csproj (owner request, 2026-10-12), so the tool that packs
  # a release always matches the library inside it - an update through NuGet moves both. Until
  # then only the macOS job was pinned, and Windows and Linux installed whatever vpk was newest.
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
      vpk_version: ${{ steps.vpk.outputs.vpk_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read version from project
        id: ver
        run: |
          VERSION=$(dotnet msbuild ${{ env.PROJECT }} -getProperty:InformationalVersion -nologo)
          echo "Read version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Read Velopack version from project
        id: vpk
        run: |
          VPK_VERSION=$(dotnet msbuild ${{ env.PROJECT }} -getItem:PackageReference -nologo \
            | jq -r '.Items.PackageReference[] | select(.Identity == "Velopack") | .Version')
          if [ -z "$VPK_VERSION" ] || [ "$VPK_VERSION" = "null" ]; then
            echo "::error::No Velopack PackageReference with a Version in ${{ env.PROJECT }}"
            exit 1
          fi
          echo "Read Velopack version: $VPK_VERSION"
          echo "vpk_version=$VPK_VERSION" >> $GITHUB_OUTPUT

  ###############################################################
  # BUILD AND UNIT TEST GATE
  ###############################################################
  # Nothing gets published unless the commit being released builds clean and the
  # full test suite passes. This duplicates build-and-unittest.yml on purpose:
  # that one proves main is healthy on every push, while this one proves the
  # exact commit being released is shippable - a release can be started from any
  # branch at any moment, including a commit that never went through that check.
  test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Unit Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build --logger "console;verbosity=normal"

  ###############################################################
  # CODEQL SECURITY SCAN
  ###############################################################
  security-scan:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload results to GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'csharp'
          build-mode: autobuild

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  ###############################################################
  # WINDOWS BUILD (x64 with self-contained .NET10)
  ###############################################################
  build-windows:
    needs: [test, determine-version]
    name: Build Windows (x64 with self-contained .NET10)
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows (x64)
        shell: powershell
        run: |
          dotnet publish ${{ env.PROJECT }} `
            -c Release `
            -f ${{ env.TFM_MODERN }} `
            -r win-x64 `
            --self-contained `
            -p:Version=${{ needs.determine-version.outputs.version }} `
            -o publish/windows-x64

      - name: Copy data pack
        shell: powershell
        run: |
          Copy-Item -Path "Assets/Data" -Destination "publish/windows-x64" -Recurse

      # The Velopack package's version (see determine-version). --allow-downgrade because this
      # runner is self-hosted and keeps its global tools between runs: without it, a vpk already
      # installed at a NEWER version makes the install fail.
      - name: Install vpk
        shell: powershell
        run: dotnet tool install -g vpk --version "${{ needs.determine-version.outputs.vpk_version }}" --allow-downgrade

      # ###########################################################################################
      # *** VELOPACK DOES ALL THE SIGNING, not separate jsign steps. ***
      #
      # This used to sign exactly two files by hand - the main .exe before packing and Setup.exe
      # after - and shipped every other binary unsigned: our own DLLs, the Avalonia/QuestPDF/
      # ProDataGrid DLLs, minipro.exe, and the two executables Velopack ADDS inside the package
      # (Squirrel.exe, which becomes the installed Update.exe, and the launcher stub in the install
      # folder). Signing after "vpk pack" cannot reach those two at all - they are already inside
      # the .nupkg by then - so the signing has to happen inside the pack.
      #
      # With VPK_SIGN_TEMPLATE set, vpk signs every .exe/.dll in the package that does NOT already
      # carry a trusted signature, then Setup.exe. Files already signed by their publisher (the .NET
      # runtime, SkiaSharp, HarfBuzz, av_libglesv2) keep that signature rather than having ours put
      # over it. Note ReadyToRun (see CRT.App.csproj) recompiles NuGet DLLs and STRIPS their
      # publisher's signature - EPPlus and the Microsoft.Extensions.* DLLs arrive here unsigned for
      # that reason, and are signed with ours.
      #
      # Details that were each verified with a dry run, and are easy to undo by accident:
      #   - The template goes in as an ENVIRONMENT VARIABLE, not --signTemplate. Windows
      #     PowerShell 5.1 mangles the quotes of a native argument that itself contains spaces,
      #     and vpk then rejects the rest of the line as an unknown argument.
      #   - "--storepass env:YUBIKEY_PIN" makes jsign read the PIN from the environment, so the
      #     PIN is never part of a command line vpk could print.
      #   - {{file...}} (not {{file}}) passes up to 10 files per jsign call: 7 calls instead of
      #     59, one JVM start and one YubiKey login each. vpk runs the calls ONE AT A TIME and
      #     stops at the first failure, so a wrong PIN costs one of the YubiKey's three PIN
      #     attempts per run, exactly as the old two-step signing did. Anything that makes these
      #     calls run in parallel could lock the YubiKey in a single run.
      #
      # "--runtime win-x64": without it vpk warns "No architecture specified" and puts the 32-bit
      # builds of Update.exe (Squirrel.exe in the package) and the launcher stub into a 64-bit app;
      # with it both are 64-bit (checked in the PE headers of a dry run). Nothing else changed in
      # that dry run: Setup.exe was already 64-bit, the package already recorded x64, and the
      # channel stays "win" - vpk takes the default channel from the operating system alone - so
      # every file name, and the releases.win.json that installed copies read, is exactly as before.
      # ###########################################################################################
      - name: Pack and sign with Velopack
        shell: powershell
        env:
          YUBIKEY_PIN: ${{ secrets.YUBIKEY_PIN }}
          VPK_SIGN_TEMPLATE: 'java -jar C:\tools\jsign-6.0.jar --storetype YUBIKEY --storepass env:YUBIKEY_PIN --tsaurl http://timestamp.digicert.com --alg SHA-256 {{file...}}'
        run: |
          vpk pack `
            --packId ${{ env.PACK_ID }} `
            --packVersion ${{ needs.determine-version.outputs.version }} `
            --packDir publish/windows-x64 `
            --mainExe ${{ env.EXE_WINDOWS }} `
            --runtime win-x64 `
            --noPortable `
            --icon "Assets/CRT_icon.ico" `
            --packTitle "Classic Repair Toolbox" `
            --outputDir velopack-output

      # The guard that stops "not every file is signed" from coming back silently. Opens the full
      # .nupkg (what Setup.exe installs and what an update downloads) and requires a VALID
      # Authenticode signature on every .exe and .dll in it, and on Setup.exe - ours or the original
      # publisher's. A new unsigned dependency, or signing quietly switched off, fails the release
      # here instead of reaching users.
      - name: Verify every shipped binary is signed
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = Get-ChildItem velopack-output\*-full.nupkg | Select-Object -First 1
          $unpacked = Join-Path $env:RUNNER_TEMP 'signature-check'
          Remove-Item -LiteralPath $unpacked -Recurse -Force -ErrorAction SilentlyContinue
          [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg.FullName, $unpacked)

          $binaries = @(Get-ChildItem -Recurse -File $unpacked | Where-Object { $_.Extension -in '.exe', '.dll' }) +
                      @(Get-ChildItem velopack-output\*-Setup.exe)
          $results = foreach ($file in $binaries) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            [pscustomobject]@{
              Name   = $file.Name
              Status = $sig.Status
              Signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.GetNameInfo('SimpleName', $false) } else { '' }
            }
          }

          Write-Host "Checked $($results.Count) binaries. Signed by:"
          $results | Group-Object Signer | Sort-Object Count -Descending | ForEach-Object { Write-Host "  $($_.Count) x $($_.Name)" }

          $bad = @($results | Where-Object { $_.Status -ne 'Valid' })
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error::Not validly signed ($($_.Status)): $($_.Name)" }
            exit 1
          }

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-windows-x64
          path: velopack-output/*

  ###############################################################
  # LINUX BUILD (x64 with self-contained .NET10)
  ###############################################################
  build-linux:
    needs: [test, determine-version]
    name: Build Linux (x64 with self-contained .NET10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux (x64)
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -c Release \
            -f ${{ env.TFM_MODERN }} \
            -r linux-x64 \
            --self-contained \
            -p:Version=${{ needs.determine-version.outputs.version }} \
            -o publish/linux-x64

      - name: Copy data pack
        run: |
          cp -r Assets/Data publish/linux-x64/

      # The Velopack package's version (see determine-version)
      - name: Install vpk
        run: dotnet tool install -g vpk --version "${{ needs.determine-version.outputs.vpk_version }}" --allow-downgrade

      # "--runtime linux-x64" only silences vpk's "No architecture specified" warning: on Linux it
      # already defaulted to the x64 updater, and the channel stays "linux" either way. macOS is
      # left without one on purpose - vpk raises no warning there and ships one universal updater.
      - name: Pack with Velopack
        run: |
          vpk pack \
            --packId ${{ env.PACK_ID }} \
            --packTitle "Classic Repair Toolbox" \
            --packVersion ${{ needs.determine-version.outputs.version }} \
            --packDir publish/linux-x64 \
            --mainExe ${{ env.EXE_UNIX }} \
            --runtime linux-x64 \
            --icon "Assets/CRT_icon.png" \
            --outputDir velopack-output

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-linux-x64
          path: velopack-output/*

  ###############################################################
  # MACOS BUILD (arm64 + x64 with self-contained .NET10)
  ###############################################################
  build-macos:
    needs: [test, determine-version]
    name: Build macOS (arm64 + x64 with self-contained .NET10)
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
      # The bundle ID Velopack derived from PACK_ID for every CRT released so far. macOS files
      # an app's permissions under it, so it must never change.
      MAC_BUNDLE_ID: com.Classic_Repair_Toolbox.Classic_Repair_Toolbox
      # This job builds the .app itself ("Build the app bundles"); Velopack signs and packs it,
      # renaming the folder to --packTitle.
      MAC_APP: Classic Repair Toolbox.app
      # What the hardened runtime allows CRT: Velopack 1.2.161's default set, which is Microsoft's
      # list for .NET - allow-jit and allow-unsigned-executable-memory for the JIT, library
      # validation off for the native libraries (Avalonia, SkiaSharp, HarfBuzz, QuestPDF), which
      # are not signed by the app's team. CRT's own copy, so a Velopack update cannot change it;
      # the verify step compares the signed app's entitlements with it and starts the app.
      MAC_ENTITLEMENTS: Assets/macOS/CRT.entitlements
      # vpk is the Velopack package's version in CRT.App.csproj, as in every build job (see
      # determine-version). This job writes the Info.plist Velopack would otherwise generate, so an
      # update of the package matters here most: "Compare Info.plist with Velopack's" fails when
      # the new vpk's own plist has a key ours lacks - then follow the plist.
      VPK_VERSION: ${{ needs.determine-version.outputs.vpk_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish macOS (arm64)
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -c Release \
            -f ${{ env.TFM_MODERN }} \
            -r osx-arm64 \
            --self-contained \
            -p:Version=$VERSION \
            -o "publish/macos-arm64/$MAC_APP/Contents/MacOS"

      - name: Publish macOS (x64)
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -c Release \
            -f ${{ env.TFM_MODERN }} \
            -r osx-x64 \
            --self-contained \
            -p:Version=$VERSION \
            -o "publish/macos-x64/$MAC_APP/Contents/MacOS"

      - name: Install vpk
        run: dotnet tool install -g vpk --version "$VPK_VERSION" --allow-downgrade

      # CRT's own Info.plist, because Velopack's has no NSLocalNetworkUsageDescription (reported
      # 2026-10-12: connecting to a scope failed with "No route to host" although "Local Network"
      # was switched on for CRT). It holds every key Velopack wrote itself (CRT 3.0.0's, read back
      # from its package) - "Compare Info.plist with Velopack's" keeps it so. The two version keys
      # are the X.Y.Z Apple asks for, where Velopack wrote the full version ("3.0.1-alpha.1") and
      # "3.0.0.0"; nothing reads them (Velopack takes the version from its own sq.version).
      - name: Write Info.plist
        run: |
          cat > "$RUNNER_TEMP/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Classic Repair Toolbox</string>
            <key>CFBundleIdentifier</key>
            <string>${MAC_BUNDLE_ID}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION%%-*}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleExecutable</key>
            <string>${{ env.EXE_UNIX }}</string>
            <key>CFBundleIconFile</key>
            <string>CRT_icon.icns</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION%%-*}</string>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSLocalNetworkUsageDescription</key>
            <string>CRT connects to your oscilloscope on the local network, to control it and fetch its screen captures.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/Info.plist"
          cat "$RUNNER_TEMP/Info.plist"

      # The .app is built here rather than by Velopack, so that the data pack goes in
      # Contents/Resources: codesign signs every file under Contents/MacOS as code, keeping a
      # non-code file's signature in extended attributes, which the update .nupkg (a zip) cannot
      # carry - and the data pack was 11,007 of the 11,255 files there in 3.0.0. CRT seeds a new
      # data root from either place (BundledDataLocation). The .NET assemblies have to stay
      # beside the executable.
      #
      # Each executable also gets its own LC_UUID (macos-macho-uuid.py says why). That invalidates
      # the SDK's signature on it, which Velopack's signing below replaces.
      - name: Build the app bundles
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            APP="publish/macos-$arch/$MAC_APP"
            mkdir -p "$APP/Contents/Resources"
            cp "$RUNNER_TEMP/Info.plist" "$APP/Contents/Info.plist"
            cp Assets/CRT_icon.icns "$APP/Contents/Resources/"
            cp -R Assets/Data "$APP/Contents/Resources/Data"
            UUID=$(python3 .github/workflows/macos-macho-uuid.py set "$APP/Contents/MacOS/${{ env.EXE_UNIX }}" "$MAC_BUNDLE_ID/$VERSION/osx-$arch")
            echo "$arch: LC_UUID $UUID"
            echo "MAC_UUID_$arch=$UUID" >> "$GITHUB_ENV"
          done

      # Velopack writes nothing into a ready-made bundle's Info.plist, so a key a newer Velopack
      # starts writing would silently be missing from ours. This has vpk generate its own plist
      # for the same app (vpk bundle, on the executable alone) and fails on any key ours lacks or
      # holds differently - the two version keys apart, which ours give as X.Y.Z on purpose.
      - name: Compare Info.plist with Velopack's
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf "$RUNNER_TEMP/vpk-bundle-in" "$RUNNER_TEMP/vpk-bundle-out"
          mkdir -p "$RUNNER_TEMP/vpk-bundle-in"
          cp "publish/macos-arm64/$MAC_APP/Contents/MacOS/${{ env.EXE_UNIX }}" "$RUNNER_TEMP/vpk-bundle-in/"
          vpk bundle \
            --packId ${{ env.PACK_ID }} \
            --packTitle "Classic Repair Toolbox" \
            --packVersion "$VERSION" \
            --packDir "$RUNNER_TEMP/vpk-bundle-in" \
            --mainExe ${{ env.EXE_UNIX }} \
            --icon "Assets/CRT_icon.icns" \
            --outputDir "$RUNNER_TEMP/vpk-bundle-out"
          GENERATED=("$RUNNER_TEMP"/vpk-bundle-out/*.app/Contents/Info.plist)
          if [ ${#GENERATED[@]} -ne 1 ]; then
            echo "::error::vpk bundle made ${#GENERATED[@]} Info.plist files, expected one"
            exit 1
          fi
          python3 - "${GENERATED[0]}" "$RUNNER_TEMP/Info.plist" <<'PY'
          import plistlib, sys
          generated = plistlib.load(open(sys.argv[1], "rb"))
          ours = plistlib.load(open(sys.argv[2], "rb"))
          print("Velopack's:", generated)
          print("Ours:      ", ours)
          ours_on_purpose = {"CFBundleVersion", "CFBundleShortVersionString"}
          problems = []
          for key, value in generated.items():
              if key not in ours:
                  problems.append(f"{key}: Velopack writes {value!r}, ours has no such key")
              elif key not in ours_on_purpose and ours[key] != value:
                  problems.append(f"{key}: Velopack writes {value!r}, ours has {ours[key]!r}")
          for problem in problems:
              print(f"::error::Info.plist: {problem}")
          sys.exit(1 if problems else 0)
          PY

      # VPK_SIGN_APP_IDENTITY "-" makes Velopack sign the whole bundle ad hoc (codesign --deep,
      # hardened runtime, the entitlements in MAC_ENTITLEMENTS). Without an identity it signs
      # nothing: CRT 3.0.0's executable kept the .NET SDK's ad-hoc signature, named "apphost" with
      # no Info.plist bound to it, which macOS cannot match to the Local Network switch. It is
      # passed as Velopack's environment variable so no argument parser can take the "-" for an
      # option. Ad hoc is not Developer ID: Gatekeeper still asks on first open, and every release
      # is a new program to macOS (a new signature and LC_UUID), so expect it to ask about the
      # local network again after an update.
      - name: Pack with Velopack (macOS arm64)
        env:
          VPK_SIGN_APP_IDENTITY: "-"
        run: |
          vpk pack \
            --packId ${{ env.PACK_ID }} \
            --packTitle "Classic Repair Toolbox" \
            --packVersion "$VERSION" \
            --packDir "publish/macos-arm64/$MAC_APP" \
            --mainExe ${{ env.EXE_UNIX }} \
            --channel osx-arm64 \
            --noPortable \
            --signEntitlements "$MAC_ENTITLEMENTS" \
            --outputDir velopack-output

      - name: Pack with Velopack (macOS x64)
        env:
          VPK_SIGN_APP_IDENTITY: "-"
        run: |
          vpk pack \
            --packId ${{ env.PACK_ID }} \
            --packTitle "Classic Repair Toolbox" \
            --packVersion "$VERSION" \
            --packDir "publish/macos-x64/$MAC_APP" \
            --mainExe ${{ env.EXE_UNIX }} \
            --channel osx-x64 \
            --noPortable \
            --signEntitlements "$MAC_ENTITLEMENTS" \
            --outputDir velopack-output

      # Checks the app a fresh install gets AND the one an in-app update installs - see the
      # script's header for what fails the release and what is only reported.
      - name: Verify the macOS app bundles
        run: |
          EXPECTED_UUID="$MAC_UUID_arm64" bash .github/workflows/macos-verify-bundle.sh arm64 velopack-output
          EXPECTED_UUID="$MAC_UUID_x64" bash .github/workflows/macos-verify-bundle.sh x64 velopack-output

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velopack-macos
          path: velopack-output/*

  ###############################################################
  # CREATE GITHUB RELEASE
  ###############################################################
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [determine-version, build-windows, build-linux, build-macos, security-scan]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all Velopack artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Set release tag
        id: tag
        run: |
          echo "tag=${{ needs.determine-version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Determine if Pre-release
        id: prerelease_check
        run: |
          IS_PRE="${{ needs.determine-version.outputs.is_prerelease }}"
          VERSION="${{ steps.tag.outputs.tag }}"

          echo "is_prerelease=$IS_PRE" >> $GITHUB_OUTPUT

          if [ "$IS_PRE" = "true" ]; then
            case "$VERSION" in
              *-alpha.*)
                STAGE_LABEL="ALPHA"
                BODY_LABEL="DEVELOPMENT"
                ;;
              *-beta.*)
                STAGE_LABEL="BETA"
                BODY_LABEL="TEST"
                ;;
              *)
                STAGE_LABEL="ALPHA"
                BODY_LABEL="DEVELOPMENT"
                ;;
            esac

            echo "release_name=$STAGE_LABEL - $VERSION" >> $GITHUB_OUTPUT
            echo "stage_label=$STAGE_LABEL" >> $GITHUB_OUTPUT
            echo "body_label=$BODY_LABEL" >> $GITHUB_OUTPUT
          else
            echo "release_name=$VERSION" >> $GITHUB_OUTPUT
          fi

      # Takes ONLY the newest version's notes out of CHANGELOG.md - the section under the
      # first "# <version>, <date>" header, up to the next one. The whole file used to be
      # pasted in, so every release body carried the entire history back to 0.1.x.
      #
      # The version header and the "-----" underline beneath it are both dropped: the
      # release is already titled with its version, so repeating it in the body is noise.
      #
      # Matching is on the HEADER POSITION, not on the version string. The workflow's
      # version comes from the csproj and a release is often built before the changelog's
      # own "2026-September-?" date placeholder is filled in, so requiring the two to
      # agree would fail the release over a date the project owner is still deciding.
      #
      # CRLF is stripped first - CHANGELOG.md is maintained on Windows, and a trailing
      # \r inside the GITHUB_OUTPUT heredoc corrupts the rendered Markdown.
      #
      # Only ever reaches a release body for a FULL release; pre-releases substitute their
      # own fixed one-liner (see "Create GitHub Release" below).
      - name: Read Changelog and append text
        id: changelog
        run: |
          {
            echo 'content<<EOF'

            if [ -f "CHANGELOG.md" ]; then
              sed 's/\r$//' CHANGELOG.md | awk '
                /^# / { if (++seen > 1) exit; next }
                seen == 1 && !body && /^-+[[:space:]]*$/ { next }
                seen == 1 { body = 1; print }
              ' | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}'
            else
              echo "No CHANGELOG.md found."
            fi

            echo ""

            if [ "${{ steps.prerelease_check.outputs.is_prerelease }}" = "true" ]; then
              echo "This is a **${{ steps.prerelease_check.outputs.stage_label }}** release, which means there are some functionalities expected not to work perfectly fine. The release is meant as a test, so do not use this if you want the most stable experience."
              echo ""
            fi

            echo "Do note that all versions come with the newest available **.NET 10** embedded (at build time), which means you do not need to install any .NET runtime for this."
            echo ""
            echo "You only need to install the **Classic Repair Toolbox** application once, and thereafter you can update directly from inside the application."

            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.prerelease_check.outputs.release_name }}
          body: |
            ${{ steps.prerelease_check.outputs.is_prerelease == 'true' && format('This is a {0} version, and should not be downloaded/used unless if coordinated with the developer.', steps.prerelease_check.outputs.body_label) || format('{0}

            ### Direct downloads for different platforms
            | Platform | File |
            |----------|------|
            | Windows (x64) | [Classic-Repair-Toolbox-win-Setup.exe](https://github.com/{1}/releases/download/{2}/Classic-Repair-Toolbox-win-Setup.exe) |
            | Linux (x64) | [Classic-Repair-Toolbox.AppImage](https://github.com/{1}/releases/download/{2}/Classic-Repair-Toolbox.AppImage) |
            | macOS Apple Silicon (arm64) | [Classic-Repair-Toolbox-osx-arm64-Setup.pkg](https://github.com/{1}/releases/download/{2}/Classic-Repair-Toolbox-osx-arm64-Setup.pkg) |
            | macOS Intel (x64) | [Classic-Repair-Toolbox-osx-x64-Setup.pkg](https://github.com/{1}/releases/download/{2}/Classic-Repair-Toolbox-osx-x64-Setup.pkg) |', steps.changelog.outputs.content, github.repository, steps.tag.outputs.tag) }}
          draft: false
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/*-Setup.exe
            release-assets/*.AppImage
            release-assets/*-Setup.pkg
            release-assets/*.nupkg
            release-assets/releases.*.json
            release-assets/assets.*.json

      # Leaves at most one pre-release standing, and none at all once a full release ships.
      # Deliberately ungated so one step covers both kinds of run - the "keep the current tag"
      # check is what lets a single rule do both jobs:
      #
      #   - A pre-release run: the tag just published IS in the pre-release list, so it is kept
      #     and every older beta is removed. Exactly one beta remains.
      #   - A full release run: the tag just published (e.g. "2.4.0") is NOT a pre-release, so
      #     nothing matches and every beta is removed. No betas remain.
      #
      # A REAL RELEASE MUST NEVER BE DELETED HERE, so two independent conditions have to agree
      # before anything is removed, and either one alone is already sufficient:
      #
      #   1. GitHub's own "isPrerelease" flag is true. This is jq-filtered before the loop, so a
      #      full release never even reaches the delete. Note this is GitHub's flag and not a
      #      guess from the tag text. A missing/null flag compares false, so it is skipped -
      #      the fail-safe direction.
      #   2. The tag is shaped "X.Y.Z-<suffix>" - the pre-release form this project produces.
      #      Bare "2.3.0" fails it, and so do the legacy date tags such as "2026-March-7",
      #      which contain hyphens but are real releases. This is the backstop for the one way
      #      condition 1 could go wrong: a real release mis-flagged as Pre-release by hand in
      #      the GitHub UI.
      #
      # This runs after "Create GitHub Release", so the replacement always exists before anything
      # is deleted - a user still on a beta never sees a moment with nothing to update to.
      # "--cleanup-tag" takes the git tag with the release, so a deleted beta leaves no trace.
      - name: Delete superseded pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.tag.outputs.tag }}
          IS_PRERELEASE: ${{ steps.prerelease_check.outputs.is_prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Pre-release run - keeping [$CURRENT_TAG] and removing every older pre-release..."
          else
            echo "Full release [$CURRENT_TAG] - removing every pre-release..."
          fi

          gh release list \
            --repo ${{ github.repository }} \
            --limit 100 \
            --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease == true) | .tagName' \
            | while read tag; do
                if [ "$tag" = "$CURRENT_TAG" ]; then
                  echo "Keeping current pre-release: $tag"
                elif ! echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-'; then
                  echo "SKIPPING [$tag] - flagged as a pre-release, but not shaped like one. Refusing to delete it."
                else
                  echo "Deleting pre-release: $tag"
                  gh release delete "$tag" \
                    --repo ${{ github.repository }} \
                    --yes \
                    --cleanup-tag
                fi
              done
