name: Build, Test and Release the Review app

#
# THE REVIEW APP'S OWN RELEASE, deliberately SEPARATE from CRT's
# (NewContributeStrategy.md Phase 5, task 8: "as a separate workflow with its own version - do not
# entangle it with CRT's release").
#
# WHY SEPARATE, rather than another job inside build-and-release.yml:
#
#   - The AUDIENCES barely overlap. CRT ships to every hobbyist using the app; this ships to a
#     handful of maintainers. Releasing them together would push a review-app fix at thousands of
#     people who cannot sign in to it, and would hold a review-app fix back behind whatever CRT
#     happens to be mid-way through.
#   - The VERSIONS are independent. This app is at 0.1.0-alpha.1 while CRT is at 2.6.x, and a
#     shared workflow reads ONE InformationalVersion - so one of the two would be released under a
#     version that means nothing for it.
#   - A FAILURE here must not stop a CRT release, and vice versa.
#
# Releases are made by hand from the Actions tab, never by pushing a tag - the same rule CRT's own
# workflow follows, and for the same reason: the tag is created by the final step, so it only
# exists for a release that actually passed. A failed run leaves nothing to clean up and the same
# version can be re-run once fixed.
#
# The version is read from InformationalVersion in CRT.Review.csproj. Bumping that property before
# running this is the only place a review-app release version is entered.
#
# *** RELEASES GO TO THEIR OWN REPOSITORY, HovKlan-DH/Classic-Repair-Toolbox-Review (maintainer
# decision, 2026-09-25) - the source stays here, only the published release lives there. ***
#
#   - CRT's Releases page is what the README sends every hobbyist to ("download the newest normal
#     version"). Review-app releases there would sit on top of CRT's, and once this app leaves
#     alpha a full release would even take CRT's "Latest" badge. There they list nothing but CRT.
#   - CRT's updater never sees these releases at all. Velopack's GithubSource (1.2.158, checked by
#     decompiling it) reads the 10 most recent releases of CRT's repository, merges every
#     releases.<channel>.json it finds into one feed, and picks the highest version WITHOUT looking
#     at the package id. In one shared repository, every review release also took one of those 10
#     slots, and enough of them in a row pushed CRT's own newest release out of reach.
#   - Publishing to another repository needs a token: the workflow's own GITHUB_TOKEN can only
#     write to this one. REVIEW_RELEASES_TOKEN is a fine-grained token with Contents read/write on
#     the release repository ONLY - never give it access to this one.
#
# *** THE VELOPACK CHANNEL IS STILL THIS APP'S OWN (review-win, review-linux) as a second guard. ***
# If a release ever landed in CRT's repository again, on CRT's default channels ("win", "linux")
# this app's packages would join every installed CRT's update feed, and a review-app version above
# an installed CRT's - CRT 1.1.0 is still out there - would be offered to it as an update. With its
# own channel it publishes releases.review-win.json / releases.review-linux.json, which CRT never
# asks for. Never pack this app on a default channel.
#
# ReviewReleaseSeparationTests (in CRT.App.Tests, beside the AppConfig it compares against) pins
# both guards.
#
# The tag and packId keep their "review" prefix from when the two shared a repository; they are
# harmless here and the packId is what an installed copy is registered under, so it must not change.
#
on:
  workflow_dispatch:

env:
  # Where the releases are published - see the header. NOT this repository.
  RELEASE_REPOSITORY: HovKlan-DH/Classic-Repair-Toolbox-Review
  # Prefixed - see the header. Installed copies are registered under it, so it must never change.
  PACK_ID: Classic-Repair-Toolbox-Review
  EXE_WINDOWS: Classic-Repair-Toolbox-Review.exe
  EXE_UNIX: Classic-Repair-Toolbox-Review
  PROJECT: src/CRT.Review/CRT.Review.csproj
  SOLUTION: Classic-Repair-Toolbox.slnx
  TFM_MODERN: net10.0

jobs:
  ###############################################################
  # DETERMINE VERSION
  ###############################################################
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read version from project
        id: ver
        run: |
          VERSION=$(dotnet msbuild ${{ env.PROJECT }} -getProperty:InformationalVersion -nologo)
          echo "Read version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Semver: a version containing "-" is a pre-release. This app starts at
          # 0.1.0-alpha.1, so every release is a pre-release until that is deliberately
          # changed - which is correct for a tool with no stable release yet.
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # Fails in seconds, before the test run, the builds and the YubiKey signing, instead of at the
      # very last step: every job waits on this one. It proves the token is SET and still VALID
      # (not expired or revoked). It cannot prove the token may WRITE to the release repository -
      # a public repository reads with any valid token, and there is no read-only way to test a
      # write - so a token without "Contents: Read and write" there still only fails at the end.
      - name: Check the release repository token
        env:
          GH_TOKEN: ${{ secrets.REVIEW_RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The REVIEW_RELEASES_TOKEN secret is not set. It must be a fine-grained token with Contents read/write on ${{ env.RELEASE_REPOSITORY }} only."
            exit 1
          fi
          if ! gh api "repos/${{ env.RELEASE_REPOSITORY }}" --jq .full_name; then
            echo "::error::REVIEW_RELEASES_TOKEN was rejected by GitHub - most likely expired or revoked."
            exit 1
          fi

  ###############################################################
  # BUILD AND UNIT TEST GATE
  ###############################################################
  # *** THE WHOLE SOLUTION, NOT JUST THIS APP. *** The review app depends on CRT.Data, which CRT
  # and the server also depend on - so a change that breaks either of them breaks this release's
  # foundation too. Testing only CRT.Review.Tests would ship a review app built on a library whose
  # own tests are red.
  test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build --logger "console;verbosity=normal"

  ###############################################################
  # WINDOWS BUILD (x64 with self-contained .NET10)
  ###############################################################
  build-windows:
    needs: [test, determine-version]
    name: Build Windows (x64 with self-contained .NET10)
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows (x64)
        shell: powershell
        run: |
          dotnet publish ${{ env.PROJECT }} `
            -c Release `
            -f ${{ env.TFM_MODERN }} `
            -r win-x64 `
            --self-contained `
            -p:Version=${{ needs.determine-version.outputs.version }} `
            -o publish/windows-x64

      # *** NO DATA PACK, unlike CRT. *** CRT ships Assets/Data so a fresh install has boards to
      # show before its first sync. The review app reads everything from the server and has no
      # local data of its own, so copying it here would add tens of megabytes a reviewer never uses.

      - name: Install vpk
        shell: powershell
        run: dotnet tool install -g vpk

      # VELOPACK DOES ALL THE SIGNING, exactly as in build-and-release.yml - read the comment on
      # its "Pack and sign with Velopack" step before changing anything here. In short: vpk signs
      # every .exe/.dll without a trusted signature (including the Squirrel.exe and launcher stub it
      # adds, which no step after the pack can reach) and then Setup.exe; the template is an
      # environment variable because PowerShell 5.1 mangles it as an argument; jsign reads the PIN
      # from the environment; and the calls run one at a time and stop at the first failure, so a
      # wrong PIN costs one YubiKey attempt per run. "--runtime win-x64" is explained there too.
      #
      # "--channel review-win" is what keeps this release out of CRT's update feed - see the header.
      - name: Pack and sign with Velopack
        shell: powershell
        env:
          YUBIKEY_PIN: ${{ secrets.YUBIKEY_PIN }}
          VPK_SIGN_TEMPLATE: 'java -jar C:\tools\jsign-6.0.jar --storetype YUBIKEY --storepass env:YUBIKEY_PIN --tsaurl http://timestamp.digicert.com --alg SHA-256 {{file...}}'
        run: |
          vpk pack `
            --packId ${{ env.PACK_ID }} `
            --packVersion ${{ needs.determine-version.outputs.version }} `
            --packDir publish/windows-x64 `
            --mainExe ${{ env.EXE_WINDOWS }} `
            --channel review-win `
            --runtime win-x64 `
            --noPortable `
            --icon "Assets/CRT_icon.ico" `
            --packTitle "Classic Repair Toolbox Review" `
            --outputDir velopack-output

      # Same guard as build-and-release.yml: every .exe/.dll in the full .nupkg, and Setup.exe,
      # must carry a VALID signature - ours or the original publisher's - or the release stops here.
      - name: Verify every shipped binary is signed
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $nupkg = Get-ChildItem velopack-output\*-full.nupkg | Select-Object -First 1
          $unpacked = Join-Path $env:RUNNER_TEMP 'signature-check'
          Remove-Item -LiteralPath $unpacked -Recurse -Force -ErrorAction SilentlyContinue
          [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg.FullName, $unpacked)

          $binaries = @(Get-ChildItem -Recurse -File $unpacked | Where-Object { $_.Extension -in '.exe', '.dll' }) +
                      @(Get-ChildItem velopack-output\*-Setup.exe)
          $results = foreach ($file in $binaries) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            [pscustomobject]@{
              Name   = $file.Name
              Status = $sig.Status
              Signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.GetNameInfo('SimpleName', $false) } else { '' }
            }
          }

          Write-Host "Checked $($results.Count) binaries. Signed by:"
          $results | Group-Object Signer | Sort-Object Count -Descending | ForEach-Object { Write-Host "  $($_.Count) x $($_.Name)" }

          $bad = @($results | Where-Object { $_.Status -ne 'Valid' })
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error::Not validly signed ($($_.Status)): $($_.Name)" }
            exit 1
          }

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: review-velopack-windows-x64
          path: velopack-output/*

  ###############################################################
  # LINUX BUILD (x64 with self-contained .NET10)
  ###############################################################
  build-linux:
    needs: [test, determine-version]
    name: Build Linux (x64 with self-contained .NET10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux (x64)
        run: |
          dotnet publish ${{ env.PROJECT }} \
            -c Release \
            -f ${{ env.TFM_MODERN }} \
            -r linux-x64 \
            --self-contained \
            -p:Version=${{ needs.determine-version.outputs.version }} \
            -o publish/linux-x64

      - name: Install vpk
        run: dotnet tool install -g vpk

      # "--channel review-linux" keeps this release out of CRT's update feed - see the header.
      - name: Pack with Velopack
        run: |
          ~/.dotnet/tools/vpk pack \
            --packId ${{ env.PACK_ID }} \
            --packVersion ${{ needs.determine-version.outputs.version }} \
            --packDir publish/linux-x64 \
            --mainExe ${{ env.EXE_UNIX }} \
            --channel review-linux \
            --runtime linux-x64 \
            --icon "Assets/CRT_icon.ico" \
            --packTitle "Classic Repair Toolbox Review" \
            --outputDir velopack-output

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: review-velopack-linux-x64
          path: velopack-output/*

  ###############################################################
  # CREATE THE GITHUB RELEASE
  ###############################################################
  create-release:
    needs: [determine-version, build-windows, build-linux]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Read only: the release is written to RELEASE_REPOSITORY with REVIEW_RELEASES_TOKEN, and this
    # workflow's own token never needs to write to CRT's repository.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      # ###########################################################################################
      # *** THE RELEASE BODY IS GENERATED, NOT TAKEN FROM CHANGELOG.md. ***
      #
      # CHANGELOG.md is CRT's, written by hand by the maintainer, and is the body of every CRT
      # release. Reading it here would put CRT's release notes on a review-app release - describing
      # changes that are not in it - and any attempt to "share" it would mean editing a file that
      # is explicitly off-limits.
      #
      # So this body says what it can say truthfully and no more: the version, and where to look
      # for what changed. If the review app ever wants real notes it gets its OWN changelog file;
      # it must never borrow CRT's.
      #
      # It names the exact SOURCE COMMIT, because nothing else in the release repository does: the
      # tag there points at that repository's own README commit, not at the code that was built.
      # ###########################################################################################
      - name: Build release body
        id: body
        run: |
          {
            echo 'text<<RELEASE_BODY_EOF'
            echo "Review application ${{ needs.determine-version.outputs.version }}."
            echo ""
            echo "The maintainer tool for reviewing and publishing contributions. It is not the"
            echo "Classic Repair Toolbox application itself and is of no use without a review account."
            echo ""
            echo "Built from ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }} -"
            echo "see that repository's commit history for what changed in this build."
            echo 'RELEASE_BODY_EOF'
          } >> $GITHUB_OUTPUT

      # Published to RELEASE_REPOSITORY, not this one - see the header. No target_commitish: the
      # tag is created on that repository's default branch, since this commit does not exist there.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          token: ${{ secrets.REVIEW_RELEASES_TOKEN }}
          tag_name: review-v${{ needs.determine-version.outputs.version }}
          name: Review app ${{ needs.determine-version.outputs.version }}
          body: ${{ steps.body.outputs.text }}
          prerelease: ${{ needs.determine-version.outputs.is_prerelease }}
          files: release/*
          fail_on_unmatched_files: true
