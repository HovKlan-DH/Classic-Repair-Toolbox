name: Build and Unit Test

#
# Fast health check on every push and pull request: builds Release and runs the
# full test suite on a clean machine.
#
# Deliberately kept separate from the release workflow (build-and-release.yml).
# This one must stay cheap, fast and free of side effects so it can run on
# everything; that one signs binaries with the YubiKey and publishes a public
# release, so it stays on tags only. The release workflow runs its own copy of
# these steps as a gate, because a tag can point at any commit.
#
# Note: a "branches" filter means tag pushes do NOT trigger this - the release
# workflow handles those.
#

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

#
# Only ever keep the newest run per branch alive. Pushing several commits in a row
# would otherwise leave a queue of runs all testing superseded code; the older ones
# are cancelled the moment a newer push arrives. Cancelled runs show up grey in the
# Actions tab, which is not a failure - it just means a newer commit took over.
#
# Grouped per branch, so work on one branch never cancels another branch's run.
#
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: Classic-Repair-Toolbox.slnx

jobs:
  ###############################################################
  # BUILD AND TEST
  ###############################################################
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-build
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ${{ github.workspace }}/TestResults

      #
      # Coverage is REPORTED, not enforced. There is deliberately no threshold that fails the
      # build: a floor set while the suite is still growing either blocks unrelated work or is set
      # so low it means nothing. Making it a gate is a separate, deliberate decision.
      #
      # It exists because a percentage written into a document goes stale silently and is then
      # quoted as fact - which is exactly what happened here once already. A figure the pipeline
      # recomputes on every push cannot. This is also why no number is committed to CLAUDE.md.
      #
      # "always()" so the figures still appear when the suite is red: a run that fails a test is
      # precisely when knowing what was and was not exercised is useful.
      #
      # ONE REPORT PER TEST PROJECT, SO THEY ARE MERGED FIRST (code review, 2026-09-25). The
      # solution has three test projects and "dotnet test" writes a separate
      # coverage.cobertura.xml for each, under its own GUID folder. This step used to take
      # "find | head -1" - whichever folder happened to enumerate first - and render that ONE
      # project's figure as the total: a wrong number quoted as fact, the very failure the summary
      # script exists to prevent. Adding the three up would be just as wrong, because CRT.Data is
      # exercised by all three and its lines would be counted three times. ReportGenerator merges
      # them line by line - a line is covered when ANY project covers it - which is the only
      # honest total.
      #
      # Pinned, like jscpd below and for the same reason: the summary reads attributes off the
      # merged file's root element, a shape a major version is free to change. If the tool
      # cannot be fetched or the merge fails, the summary is SKIPPED with a message rather than
      # falling back to a single project's figure.
      #
      - name: Coverage summary
        if: always()
        run: |
          # "|| true" and the redirect matter: run: blocks run under "bash -e", so a missing
          # TestResults folder (dotnet test crashed before writing anything) would make find exit
          # non-zero and fail THIS step - masking the real failure with a second red one, which is
          # the exact case the always() above exists to report on. The script already handles an
          # empty or missing path by skipping. The "if" around the merge keeps a registry blip
          # from failing the step for the same reason.
          REPORTS=$(find "${{ github.workspace }}/TestResults" -name 'coverage.cobertura.xml' 2>/dev/null | paste -sd ';' - || true)
          MERGED=""
          if [ -n "$REPORTS" ]; then
            echo "Merging $(printf '%s' "$REPORTS" | tr ';' '\n' | wc -l) coverage report(s)."
            if dotnet tool install --tool-path "${{ runner.temp }}/reportgenerator" dotnet-reportgenerator-globaltool --version 5.5.11 \
              && "${{ runner.temp }}/reportgenerator/reportgenerator" "-reports:$REPORTS" "-targetdir:${{ github.workspace }}/CoverageMerged" "-reporttypes:Cobertura"; then
              MERGED="${{ github.workspace }}/CoverageMerged/Cobertura.xml"
            else
              echo "Could not merge the coverage reports - skipping the summary rather than quoting one project's figure as the total."
            fi
          fi
          bash .github/workflows/coverage-summary.sh "$MERGED"

      #
      # The raw Cobertura XML, kept so a specific run's per-file numbers can be inspected later
      # (the job summary only carries the totals) - each test project's own report plus the
      # merged one the summary was computed from. Short retention: this is a health check that
      # runs on every push, and the report is only interesting while the run is recent.
      #
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            ${{ github.workspace }}/TestResults/**/coverage.cobertura.xml
            ${{ github.workspace }}/CoverageMerged/Cobertura.xml
          retention-days: 7
          if-no-files-found: ignore

      #
      # Duplication is REPORTED, not enforced - the same deal as coverage above, and for a sharper
      # reason: this codebase carries a long tail of structurally similar UI code (four worklog
      # dialogs sharing an Escape/Ctrl+Enter handler, viewport helpers differing by exactly the
      # bounds check their names describe) that a clone detector flags and that nobody intends to
      # change. A threshold over that would fire on non-defects until people stopped reading it.
      #
      # It exists because before this, NOTHING measured duplication - not this workflow, not the
      # csproj, not CodeQL (security queries, not clone detection). The duplicated helpers named in
      # .claude/CLAUDE.md were all found by hand after they had shipped.
      #
      # Scoped to the app's own source folders: Tests/ is excluded on purpose, since test files
      # legitimately repeat arrange/assert shapes and would dominate the figure with noise.
      #
      # "always()" so the figure still appears when the suite is red, matching the coverage step -
      # a run that fails is when knowing what the code looks like is most useful. "continue-on-
      # error" because a health-check run must not go red over a reporting tool: jscpd is fetched
      # from npm at run time, so a registry blip is an infrastructure failure, not a code failure.
      #
      # Pinned rather than @latest: the summary script reads .statistics.total out of the JSON
      # report, which is a shape this tool is free to change in a major version. An unpinned fetch
      # would turn that into a silently empty summary on some future Tuesday.
      - name: Duplication check
        if: always()
        continue-on-error: true
        run: >
          npx --yes jscpd@5.1.2 src/CRT.App/Handlers src/CRT.App/Main src/CRT.App/Tabs src/CRT.Data
          --format csharp
          --min-lines 10
          --reporters json
          --output ${{ github.workspace }}/DuplicationResults

      - name: Duplication summary
        if: always()
        # Reporting only - it renders totals into the job summary and decides nothing. Same
        # continue-on-error as the duplication step it reads from, and for the same reason: a
        # failure here is infrastructure (a crash inside the script, an unreadable report), not a
        # finding about the code, and it must not turn an otherwise green run red.
        continue-on-error: true
        run: |
          # An empty path when the report is missing - the duplication step above runs under
          # continue-on-error, so it can fail and leave no file behind. Passing "" rather than a
          # non-existent path is what the script's own skip branch expects, and testing with
          # "[ ! -f ]" keeps this from tripping "bash -e" and masking the real result.
          REPORT="${{ github.workspace }}/DuplicationResults/jscpd-report.json"
          if [ ! -f "$REPORT" ]; then REPORT=""; fi
          bash .github/workflows/duplication-summary.sh "$REPORT"

      #
      # The full JSON, kept so a specific run's per-clone file and line numbers can be inspected
      # later - the job summary only carries the totals. Same short retention as the coverage
      # artifact, and for the same reason.
      #
      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplication-report
          path: ${{ github.workspace }}/DuplicationResults/jscpd-report.json
          retention-days: 7
          if-no-files-found: ignore
